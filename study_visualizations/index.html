
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global CT Study Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px 20px 10px 20px;
            background-color: #0f172a;
        }
        .study-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .study-item {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-size: 0.9rem;
            position: relative;
        }
        .study-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 15px;
            right: 15px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        .study-item:hover {
            background-color: #334155;
        }
        .study-item.active {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .study-item-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: #f8fafc;
            word-break: break-all;
            line-height: 1.4;
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            transition: color 0.2s;
        }
        
        .study-item-meta {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            gap: 10px;
            transition: color 0.2s;
        }
        
        .study-item-badge {
            font-size: 0.7rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 1px 6px;
            border-radius: 10px;
            color: #3b82f6;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        /* Active State Overrides */
        .study-item.active .study-item-title { color: #ffffff; }
        .study-item.active .study-item-title i { color: #ffffff !important; }
        .study-item.active .study-item-meta { color: rgba(255, 255, 255, 0.8); }
        .study-item.active .study-item-meta i { opacity: 0.9 !important; color: #ffffff !important; }
        .study-item.active .study-item-badge {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
        }
        .study-item.active .study-item-badge i { color: #ffffff !important; }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 16px 24px;
            background-color: #1e293b;
            box-shadow: 0 4px 10px rgb(0 0 0 / 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .viewer-container {
            flex: 1;
            display: flex;
            padding: 24px;
            gap: 20px;
            overflow: hidden;
        }
        .image-section {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            overflow: hidden;
            cursor: grab;
            border: 1px solid #334155;
        }
        .view-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f8fafc;
            font-size: 1.1rem;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            background: rgba(15, 23, 42, 0.5);
            padding: 4px 12px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 0.02em;
        }
        .image-section:active {
            cursor: grabbing;
        }
        #slice-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            pointer-events: none;
            user-select: none;
            will-change: transform;
        }
        .info-section {
            flex: 1;
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.3);
        }
        .label-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 4px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            margin: 0;
            white-space: nowrap;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        /* Custom Tooltip */
        .label-badge::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #1e293b;
            color: #f8fafc;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
            border: 1px solid #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }
        .label-badge:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        /* Triangle for tooltip */
        .label-badge::before {
            content: '';
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            border: 6px solid transparent;
            border-top-color: #3b82f6;
            opacity: 0;
            transition: all 0.2s ease-out;
            z-index: 1000;
        }
        .label-badge:hover::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .label-true { background-color: #ef4444; color: white; }
        .label-false { background-color: #334155; color: #94a3b8; }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type=range] { 
            width: 100%; 
            cursor: pointer;
            accent-color: #3b82f6;
            height: 6px;
            border-radius: 3px;
            background: #334155;
            outline: none;
        }
        .nav-btns { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            background-color: #3b82f6;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2563eb; }
        .metadata-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px 16px;
            font-size: 0.85rem;
            color: #94a3b8;
            background: #0f172a55;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #33415566;
        }
        .metadata-label { 
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600; 
            color: #64748b; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            align-self: center; 
        }
        .metadata-label i { width: 14px; height: 14px; }
        .metadata-value { color: #f8fafc; font-family: monospace; font-size: 0.9rem; word-break: break-all; }
        .keyboard-hints-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
            margin-top: auto;
        }
        .keyboard-hint-item {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hint-text { opacity: 0.7; }
        kbd {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 0.7rem;
            color: #f8fafc;
            font-family: monospace;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        /* Viewer Tools Styles */
        .viewer-tools {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        .tool-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #475569;
            color: #f8fafc;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .tool-btn i { width: 22px; height: 22px; }
        .tool-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* Search & Navigation Enhancements */
        .search-container {
            padding: 10px 20px 15px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
        }
        .search-input {
            width: 100%;
            padding: 10px 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .slice-counter-display {
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 2px 8px;
            width: fit-content;
        }
        .slice-total {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-left: 4px;
            font-family: monospace;
            white-space: nowrap;
        }
        .slice-nav-footer {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .slice-nav-btn {
            flex: 1;
            background: #3b82f6;
            border: none;
            color: #ffffff;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0;
        }
        .slice-nav-btn svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.5px;
            display: block;
        }
        .slice-nav-btn:hover {
            background: #2563eb;
        }
        .slice-nav-btn:active {
            background: #1d4ed8;
        }
        .slice-input {
            width: 36px;
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 0;
            font-weight: 700;
            text-align: center;
            font-size: 0.95rem;
            outline: none;
            font-family: monospace;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .slice-input::-webkit-outer-spin-button,
        .slice-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .window-info {
            font-size: 0.8rem;
            background: #3b82f622;
            color: #3b82f6;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #3b82f644;
            display: inline-block;
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        /* Montage Preview Styles */
        .montage-preview-container {
            margin-top: 5px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            max-height: 320px;
            overflow: hidden;
        }
        .montage-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .montage-preview-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .montage-preview-card {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow-x: hidden;
            overflow-y: auto;
            border: 1px solid #334155;
            cursor: pointer;
            transition: border-color 0.2s;
            height: 280px;
            display: block; /* Change from flex to allow scrolling */
        }
        .montage-preview-card:hover {
            border-color: #3b82f6;
        }
        .montage-preview-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .montage-preview-overlay {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            gap: 4px;
            padding: 6px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .montage-preview-card:hover .montage-preview-overlay {
            opacity: 1;
        }
        .montage-preview-card::-webkit-scrollbar {
            width: 4px;
        }
        .montage-preview-card::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .montage-active-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #3b82f6;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        .montage-mode .montage-active-badge {
            display: block;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px;">
                <i data-lucide="brain-circuit" style="color: #3b82f6; width: 24px; height: 24px;"></i>
                CT Studies
            </h2>
            <p style="margin:5px 0 0 0; font-size: 0.75rem; opacity: 0.6;">Epidural Hemorrhage Dataset</p>
        </div>
        <div class="search-container" style="position: relative;">
            <i data-lucide="search" style="position: absolute; left: 32px; top: 22px; width: 16px; height: 16px; opacity: 0.4;"></i>
            <input type="text" id="study-search" class="search-input" placeholder="Search by filename or ID..." style="padding-left: 36px;">
        </div>
        <div class="study-list" id="study-list">
            <!-- Study items will be injected here -->
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div id="study-header-info">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="file-text" style="color: #3b82f6; width: 24px; height: 24px;"></i>
                    <h3 id="display-filename" style="margin:0; font-size: 1.4rem; color: #f8fafc; word-break: break-all;">Select a study</h3>
                </div>
                <div style="display: flex; align-items: center; gap: 20px; margin-top: 8px; opacity: 0.9; font-size: 0.85rem; color: #94a3b8;">
                    <span style="display: flex; align-items: center; gap: 6px;"><i data-lucide="user" style="width: 14px; height: 14px;"></i> P: <span id="display-patient-id" style="color: #f8fafc; font-weight: 600;">-</span></span>
                    <span style="display: flex; align-items: center; gap: 6px;"><i data-lucide="folder" style="width: 14px; height: 14px;"></i> S: <span id="display-study-id" style="color: #f8fafc; font-weight: 600;">-</span></span>
                    <span style="display: flex; align-items: center; gap: 6px;"><i data-lucide="hash" style="width: 14px; height: 14px;"></i> Ser: <span id="display-series-id" style="color: #f8fafc; font-weight: 600;">-</span></span>
                </div>
            </div>
        </div>
        
        <div class="viewer-container">
            <div class="image-section">
                <div id="slice-title-overlay" class="view-overlay">Slice 1</div>
                <img id="slice-img" src="" alt="Select a study to view">
                
                <div class="viewer-tools">
                    <button class="tool-btn" onclick="adjustZoom(1.2)" title="Zoom In">
                        <i data-lucide="zoom-in"></i>
                    </button>
                    <button class="tool-btn" onclick="adjustZoom(0.8)" title="Zoom Out">
                        <i data-lucide="zoom-out"></i>
                    </button>
                    <button class="tool-btn" onclick="resetTransform()" title="Reset View">
                        <i data-lucide="refresh-cw"></i>
                    </button>
                </div>
            </div>
            
            <div class="info-section">
                <div class="metadata-grid">
                    <div class="metadata-label"><i data-lucide="file-text"></i> File</div>
                    <div id="filename-text" class="metadata-value">-</div>
                    <div class="metadata-label"><i data-lucide="layers"></i> Windowing</div>
                    <div id="window-text" class="metadata-value">Brain (80/40)</div>
                </div>
                
                <div id="labels-container">
                    <!-- Labels will be injected here -->
                </div>
                
                <div class="control-panel">
                    <div class="control-header">
                        <label for="slice-slider" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b;">Navigate Slices:</label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div class="slice-counter-display">
                                <input type="number" id="slice-jump-input" class="slice-input" min="1" value="1">
                            </div>
                            <span id="slice-total-text" class="slice-total">/ --</span>
                        </div>
                    </div>
                    <input type="range" id="slice-slider" class="slice-slider" min="0" value="0" step="1">
                    <div class="slice-nav-footer">
                        <button class="slice-nav-btn" onclick="changeSlice(-1)" title="Previous Slice"><i data-lucide="chevron-left"></i> PREV</button>
                        <button class="slice-nav-btn" onclick="changeSlice(1)" title="Next Slice">NEXT <i data-lucide="chevron-right"></i></button>
                    </div>
                </div>

                <div class="montage-preview-container">
                    <div class="montage-preview-card" onclick="toggleMontageMode()" id="montage-card" title="Click to swap view">
                        <div class="montage-active-badge" id="montage-badge">Montage View</div>
                        <img id="montage-preview-img" src="" alt="Montage Preview">
                        <div class="montage-preview-overlay">
                            <i data-lucide="repeat" style="width: 12px; height: 12px;"></i>
                            SWAP VIEW
                        </div>
                    </div>
                </div>

                <div class="keyboard-hints-grid">
                    <div style="grid-column: span 2; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: #f8fafc; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
                        <i data-lucide="keyboard" style="width: 14px; height: 14px; color: #3b82f6;"></i>
                        Shortcuts
                    </div>
                    <div class="keyboard-hint-item">
                        <span><kbd>←</kbd> <kbd>→</kbd> / <kbd>Scroll</kbd></span>
                        <span class="hint-text">Flip Slices</span>
                    </div>
                    <div class="keyboard-hint-item">
                        <span><kbd>Ctrl</kbd> + <kbd>Scroll</kbd></span>
                        <span class="hint-text">Zoom View</span>
                    </div>
                    <div class="keyboard-hint-item">
                        <span><kbd>Drag</kbd></span>
                        <span class="hint-text">Pan View</span>
                    </div>
                    <div class="keyboard-hint-item">
                        <span><kbd>PgUp</kbd> <kbd>PgDn</kbd></span>
                        <span class="hint-text">Studies</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studies = {}; // Summary list
        let studyDetails = {}; // Cache for full study data (slices)
        let currentStudyId = null;
        let currentIndex = 0;
        let isMontageMode = false;
        
        // Zoom & Pan State
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isPanning = false;
        let startX, startY;

        const imgElement = document.getElementById('slice-img');
        const imageSection = document.querySelector('.image-section');
        const montagePreviewImg = document.getElementById('montage-preview-img');
        const montageCard = document.getElementById('montage-card');
        let preloadQueue = [];
        let preloadingActive = false;
        let lastPreloadIndex = 0;
        const preloadedImages = {}; // Map of studyId -> Map of sliceIndex -> Image object

        const studyList = document.getElementById('study-list');
        const slider = document.getElementById('slice-slider');
        const sliceJumpInput = document.getElementById('slice-jump-input');
        const sliceTotalText = document.getElementById('slice-total-text');
        const filenameText = document.getElementById('filename-text');
        const windowText = document.getElementById('window-text');
        const labelsContainer = document.getElementById('labels-container');
        const displayFilename = document.getElementById('display-filename');
        const displayPatientId = document.getElementById('display-patient-id');
        const displayStudyId = document.getElementById('display-study-id');
        const displaySeriesId = document.getElementById('display-series-id');

        // Fetch Studies List
        async function initViewer() {
            try {
                const response = await fetch('data/studies_list.json');
                studies = await response.json();
                populateSidebar();
                
                // Initialize with first study
                const firstStudy = Object.keys(studies)[0];
                if (firstStudy) selectStudy(firstStudy);
            } catch (err) {
                console.error('Failed to load studies list:', err);
            }
        }

        // Populate Sidebar
        function populateSidebar() {
            studyList.innerHTML = '';
            Object.keys(studies).forEach(id => {
                const div = document.createElement('div');
                div.className = 'study-item';
                div.id = 'item-' + id;
                const fileName = `${studies[id].patient_id}_${id}.nii.gz`;
                div.innerHTML = `
                    <div class="study-item-title">
                        <i data-lucide="file-text" style="width: 14px; height: 14px; margin-top: 2px; color: #3b82f6; flex-shrink: 0;"></i>
                        <span style="flex: 1;">${fileName}</span>
                        <span class="study-item-badge" style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); color: #10b981; font-weight: 800; font-size: 0.65rem;">BHSD</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="study-item-meta">
                            <span style="display: flex; align-items: center; gap: 4px;">
                                <i data-lucide="user" style="width: 10px; height: 10px; opacity: 0.5;"></i>
                                P: ${studies[id].patient_id.slice(-8)}
                            </span>
                            <span style="display: flex; align-items: center; gap: 4px;">
                                <i data-lucide="folder" style="width: 10px; height: 10px; opacity: 0.5;"></i>
                                S: ${id.slice(-8)}
                            </span>
                        </div>
                        <div class="study-item-badge">
                            <i data-lucide="layers" style="width: 10px; height: 10px;"></i>
                            ${studies[id].slice_count} slices
                        </div>
                    </div>
                `;
                div.onclick = () => selectStudy(id);
                studyList.appendChild(div);
            });
            lucide.createIcons();
        }

        async function selectStudy(id) {
            if (currentStudyId) {
                const prevItem = document.getElementById('item-' + currentStudyId);
                if (prevItem) prevItem.classList.remove('active');
            }
            currentStudyId = id;
            const currentItem = document.getElementById('item-' + currentStudyId);
            if (currentItem) {
                currentItem.classList.add('active');
                currentItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            // Fetch study details if not cached
            if (!studyDetails[id]) {
                try {
                    const response = await fetch(`data/studies/${id}.json`);
                    studyDetails[id] = await response.json();
                } catch (err) {
                    console.error(`Failed to load details for study ${id}:`, err);
                    return;
                }
            }

            const data = studyDetails[id];
            displayFilename.innerText = `${data.patient_id}_${id}.nii.gz`;
            displayPatientId.innerText = data.patient_id;
            displayStudyId.innerText = id;
            displaySeriesId.innerText = data.series_id;
            
            // Reset montage mode when changing studies for clarity
            isMontageMode = false;
            document.body.classList.remove('montage-mode');
            montageCard.classList.remove('active');
            
            slider.max = data.slices.length - 1;
            
            updateViewer(0);
            preloadStudy(id);
        }

        function preloadStudy(studyId, startIndex = 0) {
            // Re-calculate queue starting from current index
            preloadQueue = [];
            lastPreloadIndex = startIndex;
            
            if (!preloadedImages[studyId]) {
                preloadedImages[studyId] = {};
            }

            if (!studyDetails[studyId]) return;
            const slices = studyDetails[studyId].slices;
            const total = slices.length;
            
            // Prioritize: Next 5, Prev 5, then rest
            let indices = [];
            // Next 10
            for (let i = 1; i <= 10; i++) {
                let idx = startIndex + i;
                if (idx < total) indices.push(idx);
            }
            // Prev 5
            for (let i = 1; i <= 5; i++) {
                let idx = startIndex - i;
                if (idx >= 0) indices.push(idx);
            }
            // Rest of the slices
            for (let i = 0; i < total; i++) {
                if (!indices.includes(i) && i !== startIndex) indices.push(i);
            }

            // Filter out already preloaded
            preloadQueue = indices.filter(idx => !preloadedImages[studyId][idx]);

            // Start preloading if not already processing
            if (!preloadingActive) {
                processPreloadQueue(studyId);
            }
        }

        function processPreloadQueue(studyId) {
            if (preloadQueue.length === 0 || currentStudyId !== studyId || !studyDetails[studyId]) {
                preloadingActive = false;
                return;
            }

            preloadingActive = true;
            const index = preloadQueue.shift();
            const img = new Image();
            img.onload = () => {
                preloadedImages[studyId][index] = img;
                processPreloadQueue(studyId);
            };
            img.onerror = () => {
                processPreloadQueue(studyId);
            };
            img.src = studyDetails[studyId].slices[index].img;
        }

        function updateViewer(index) {
            if (!currentStudyId || !studyDetails[currentStudyId]) return;
            const total = studyDetails[currentStudyId].slices.length;
            if (index < 0 || index >= total) return;
            
            currentIndex = index;
            const slice = studyDetails[currentStudyId].slices[currentIndex];
            
            // Show loading state if image not in cache
            if (!preloadedImages[currentStudyId] || !preloadedImages[currentStudyId][currentIndex]) {
                imgElement.style.opacity = '0.7';
            } else {
                imgElement.style.opacity = '1';
            }

            const sliceImgSrc = slice.img;
            const montageImgSrc = `${currentStudyId}/${currentStudyId}_montage.png`;

            if (isMontageMode) {
                imgElement.src = montageImgSrc;
                montagePreviewImg.src = sliceImgSrc;
            } else {
                imgElement.src = sliceImgSrc;
                montagePreviewImg.src = montageImgSrc;
            }
            
            imgElement.onload = () => {
                imgElement.style.opacity = '1';
                // Re-prioritize preloading if we moved more than 5 slices away from last preload start
                if (!lastPreloadIndex || Math.abs(currentIndex - lastPreloadIndex) > 5) {
                    preloadStudy(currentStudyId, currentIndex);
                }
            };

            slider.value = currentIndex;
            
            // Update slice jump input and total
            if (sliceJumpInput) sliceJumpInput.value = currentIndex + 1;
            if (sliceTotalText) sliceTotalText.innerText = `/ ${studyDetails[currentStudyId].slices.length}`;
            
            const titleTextOverlay = document.getElementById('slice-title-overlay');
            if (titleTextOverlay) {
                titleTextOverlay.style.display = isMontageMode ? 'none' : 'block';
                titleTextOverlay.innerText = `Slice ${currentIndex + 1}`;
            }
            filenameText.innerText = slice.filename;
            
            // Set window info (defaulting to Brain for this dataset)
            windowText.innerText = slice.window || "Brain (W:80, L:40)";
            
            // Re-render labels container with better layout
            labelsContainer.innerHTML = `
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                    <i data-lucide="activity" style="width: 14px; height: 14px; color: #3b82f6;"></i>
                    <h4 style="margin: 0; font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;">Classification:</h4>
                </div>
                <div id="badges-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;"></div>
            `;
            const badgesGrid = document.getElementById('badges-grid');
            const allSubtypes = ['epidural', 'intraparenchymal', 'intraventricular', 'subarachnoid', 'subdural'];
            const abbr = {
                'epidural': 'EDH',
                'intraparenchymal': 'IPH',
                'intraventricular': 'IVH',
                'subarachnoid': 'SAH',
                'subdural': 'SDH'
            };
            
            allSubtypes.forEach((s, idx) => {
                const isTrue = slice.labels[s] === 1;
                const badge = document.createElement('span');
                badge.className = `label-badge ${isTrue ? 'label-true' : 'label-false'}`;
                badge.dataset.tooltip = s.charAt(0).toUpperCase() + s.slice(1);
                badge.innerHTML = `
                    <span style="opacity: 0.5; font-size: 0.8rem; margin-right: 2px; font-weight: 700;">${idx + 1}</span>
                    <i data-lucide="${isTrue ? 'alert-triangle' : 'circle-check'}" style="width: 11px; height: 11px; margin-right: 2px;"></i>
                    <span style="font-size: 0.75rem; letter-spacing: -0.02em;">${abbr[s]}</span>
                `;
                badgesGrid.appendChild(badge);
            });
            lucide.createIcons();
        }

        function toggleMontageMode() {
            if (!currentStudyId) return;
            
            isMontageMode = !isMontageMode;
            
            if (isMontageMode) {
                document.body.classList.add('montage-mode');
                montageCard.classList.add('active');
            } else {
                document.body.classList.remove('montage-mode');
                montageCard.classList.remove('active');
            }
            
            updateViewer(currentIndex);
        }

        function changeSlice(delta) {
            if (!currentStudyId || !studyDetails[currentStudyId]) return;
            let newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < studyDetails[currentStudyId].slices.length) {
                updateViewer(newIndex);
            }
        }

        function changeStudy(delta) {
            const keys = Object.keys(studies);
            let idx = keys.indexOf(currentStudyId);
            let newIdx = idx + delta;
            if (newIdx >= 0 && newIdx < keys.length) {
                selectStudy(keys[newIdx]);
            }
        }

        let isSliding = false;
        slider.oninput = function() {
            if (isSliding) return;
            isSliding = true;
            requestAnimationFrame(() => {
                updateViewer(parseInt(this.value));
                isSliding = false;
            });
        };

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlice(1);
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') changeSlice(-1);
            if (e.key === 'PageDown') changeStudy(1);
            if (e.key === 'PageUp') changeStudy(-1);
        });

        // Search functionality
        document.getElementById('study-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.study-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'block' : 'none';
            });
        });

        // Slice jump functionality
        sliceJumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(e.target.value);
                const total = studyDetails[currentStudyId].slices.length;
                if (!isNaN(val) && val >= 1 && val <= total) {
                    updateViewer(val - 1);
                } else {
                    e.target.value = currentIndex + 1;
                }
                e.target.blur();
            }
        });

        function updateTransform() {
            imgElement.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        imageSection.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || e.target.closest('.viewer-tools')) return; // Only left click, ignore toolbar
            isPanning = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            imageSection.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            imageSection.style.cursor = 'grab';
        });

        imageSection.addEventListener('dblclick', (e) => {
            if (e.target.closest('.viewer-tools')) return; // Ignore toolbar clicks
            resetTransform();
        });

        function adjustZoom(delta) {
            const newScale = scale * delta;
            if (newScale >= 0.5 && newScale <= 10) {
                scale = newScale;
                updateTransform();
            }
        }

        function resetTransform() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        let isScrolling = false;
        let isZooming = false;
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.study-list') || e.target.closest('.montage-preview-container') || isMontageMode) return;
            
            // Zoom with Ctrl + Wheel
            if (e.ctrlKey) {
                e.preventDefault();
                if (isZooming) return;
                
                isZooming = true;
                requestAnimationFrame(() => {
                    const delta = e.deltaY > 0 ? 0.92 : 1.08; // Slightly slower for better control
                    const newScale = scale * delta;
                    
                    if (newScale >= 0.5 && newScale <= 15) {
                        const rect = imageSection.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;
                        
                        translateX -= (mouseX - rect.width/2 - translateX) * (delta - 1);
                        translateY -= (mouseY - rect.height/2 - translateY) * (delta - 1);
                        
                        scale = newScale;
                        updateTransform();
                    }
                    isZooming = false;
                });
                return;
            }

            if (isScrolling) return;
            isScrolling = true;
            requestAnimationFrame(() => {
                if (e.deltaY > 0) changeSlice(1);
                else changeSlice(-1);
                setTimeout(() => { isScrolling = false; }, 50);
            });
        }, { passive: false }); // Changed to false to allow e.preventDefault() for zoom

        // Initialize
        initViewer();
        
        // Final icon check
        lucide.createIcons();
    </script>
</body>
