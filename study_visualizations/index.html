
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global CT Study Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px 20px 10px 20px;
            background-color: #0f172a;
        }
        .study-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .study-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-size: 0.85rem;
        }
        .study-item:hover {
            background-color: #334155;
        }
        .study-item.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .study-id { font-weight: 600; }
        .patient-id { font-size: 0.75rem; opacity: 0.7; }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 15px 30px;
            background-color: #1e293b;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .viewer-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        .image-section {
            flex: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            overflow: hidden;
        }
        #slice-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .info-section {
            flex: 1;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 420px;
        }
        .label-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .label-true { background-color: #ef4444; color: white; }
        .label-false { background-color: #334155; color: #94a3b8; }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type=range] { width: 100%; cursor: pointer; }
        .nav-btns { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            background-color: #3b82f6;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2563eb; }
        .metadata-grid {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 5px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .metadata-label { font-weight: 600; color: #f8fafc; }
        .keyboard-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        /* Search & Navigation Enhancements */
        .search-container {
            padding: 10px 20px 15px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
        }
        .search-input {
            width: 100%;
            padding: 10px 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .slice-input-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slice-input {
            width: 50px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #3b82f6;
            padding: 2px 6px;
            font-weight: 600;
            text-align: center;
            font-size: 0.9rem;
            outline: none;
        }
        .slice-input:focus {
            border-color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; font-size: 1.2rem;">CT Studies</h2>
            <p style="margin:5px 0 0 0; font-size: 0.8rem; opacity: 0.6;">17 Epidural Cases</p>
        </div>
        <div class="search-container">
            <input type="text" id="study-search" class="search-input" placeholder="Search StudyID or PatientID">
        </div>
        <div class="study-list" id="study-list">
            <!-- Study items will be injected here -->
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div id="study-header-info">
                <h3 id="display-patient-id" style="margin:0; font-size: 1.1rem;">Select a study</h3>
                <p id="display-ids" style="margin:0; font-size: 0.75rem; opacity: 0.6;"></p>
            </div>
        </div>
        
        <div class="viewer-container">
            <div class="image-section">
                <img id="slice-img" src="" alt="Select a study to view">
            </div>
            
            <div class="info-section">
                <div>
                    <h3 id="slice-title" style="margin-top:0">Slice Information</h3>
                    <div class="metadata-grid">
                        <div class="metadata-label">File:</div>
                        <div id="filename-text">-</div>
                        <div class="metadata-label">Series UID:</div>
                        <div id="series-uid-text">-</div>
                        <div class="metadata-label">Slice:</div>
                        <div class="slice-input-container">
                            <input type="number" id="slice-jump-input" class="slice-input" min="1" value="1">
                            <span id="slice-total-text" style="color: #94a3b8; font-size: 0.8rem;">/ --</span>
                        </div>
                    </div>
                </div>
                
                <div id="labels-container">
                    <!-- Labels will be injected here -->
                </div>
                
                <div class="control-panel">
                    <label for="slice-slider" style="font-size: 0.9rem; font-weight: 600;">Navigate Slices:</label>
                    <input type="range" id="slice-slider" min="0" max="0" value="0">
                    <div class="nav-btns">
                        <button onclick="changeSlice(-1)">Prev</button>
                        <button onclick="changeSlice(1)">Next</button>
                    </div>
                </div>

                <div class="keyboard-hint">
                    <b>Controls:</b><br>
                    • Arrows / Scroll: Flip Slices<br>
                    • Page Up/Down: Next/Prev Study
                </div>
            </div>
        </div>
    </div>

                <div class="study-id">${id}</div>

            `;
            div.onclick = () => selectStudy(id);
            studyList.appendChild(div);
        });

        function selectStudy(id) {
            if (currentStudyId) {
                document.getElementById('item-' + currentStudyId).classList.remove('active');
            }
            currentStudyId = id;
            document.getElementById('item-' + currentStudyId).classList.add('active');
            document.getElementById('item-' + currentStudyId).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            displayPatientId.innerText = "Patient: " + studies[id].patient_id;
            displayIds.innerText = "Study: " + id + " | Series: " + studies[id].series_id;
            
            slider.max = studies[id].slices.length - 1;
            updateViewer(0);
            preloadStudy(id);
        }

        function preloadStudy(studyId, startIndex = 0) {
            // Re-calculate queue starting from current index
            preloadQueue = [];
            lastPreloadIndex = startIndex;
            
            if (!preloadedImages[studyId]) {
                preloadedImages[studyId] = {};
            }

            const slices = studies[studyId].slices;
            const total = slices.length;
            
            // Prioritize: Next 5, Prev 5, then rest
            let indices = [];
            // Next 10
            for (let i = 1; i <= 10; i++) {
                let idx = startIndex + i;
                if (idx < total) indices.push(idx);
            }
            // Prev 5
            for (let i = 1; i <= 5; i++) {
                let idx = startIndex - i;
                if (idx >= 0) indices.push(idx);
            }
            // Rest of the slices
            for (let i = 0; i < total; i++) {
                if (!indices.includes(i) && i !== startIndex) indices.push(i);
            }

            // Filter out already preloaded
            preloadQueue = indices.filter(idx => !preloadedImages[studyId][idx]);

            // Start preloading if not already processing
            if (!preloadingActive) {
                processPreloadQueue(studyId);
            }
        }

        function processPreloadQueue(studyId) {
            if (preloadQueue.length === 0 || currentStudyId !== studyId) {
                preloadingActive = false;
                return;
            }

            preloadingActive = true;
            const index = preloadQueue.shift();
            const img = new Image();
            img.onload = () => {
                preloadedImages[studyId][index] = img;
                processPreloadQueue(studyId);
            };
            img.onerror = () => {
                processPreloadQueue(studyId);
            };
            img.src = studies[studyId].slices[index].img;
        }

        function updateViewer(index) {
            if (!currentStudyId) return;
            const total = studies[currentStudyId].slices.length;
            if (index < 0 || index >= total) return;
            
            currentIndex = index;
            const slice = studies[currentStudyId].slices[currentIndex];
            
            // Show loading state if image not in cache
            if (!preloadedImages[currentStudyId] || !preloadedImages[currentStudyId][currentIndex]) {
                imgElement.style.opacity = '0.7';
            } else {
                imgElement.style.opacity = '1';
            }

            imgElement.src = slice.img;
            
            imgElement.onload = () => {
                imgElement.style.opacity = '1';
                // Re-prioritize preloading if we moved more than 5 slices away from last preload start
                if (!lastPreloadIndex || Math.abs(currentIndex - lastPreloadIndex) > 5) {
                    preloadStudy(currentStudyId, currentIndex);
                }
            };

            slider.value = currentIndex;
            
            // Update slice jump input and total
            if (sliceJumpInput) sliceJumpInput.value = currentIndex + 1;
            if (sliceTotalText) sliceTotalText.innerText = `/ ${studies[currentStudyId].slices.length}`;
            
            titleText.innerText = `Slice ${currentIndex + 1}`;
            filenameText.innerText = slice.filename;
            seriesUidText.innerText = studies[currentStudyId].series_id;
            
            // Update labels
            labelsContainer.innerHTML = '<h4 style="margin-top:0">Labels:</h4>';
            const allSubtypes = ['epidural', 'intraparenchymal', 'intraventricular', 'subarachnoid', 'subdural'];
            const abbr = {

                'intraparenchymal': 'IPH',
                'intraventricular': 'IVH',
                'subarachnoid': 'SAH',
                'subdural': 'SDH'
            };
            
            allSubtypes.forEach(s => {
                const isTrue = slice.labels[s] === 1;
                const badge = document.createElement('span');
                badge.className = `label-badge ${isTrue ? 'label-true' : 'label-false'}`;
                badge.innerText = `${abbr[s]}: ${isTrue ? 'TRUE' : 'FALSE'}`;
                labelsContainer.appendChild(badge);
            });
        }

        function changeSlice(delta) {
            if (!currentStudyId) return;
            let newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < studies[currentStudyId].slices.length) {

        function changeStudy(delta) {
            const keys = Object.keys(studies);
            let idx = keys.indexOf(currentStudyId);
            let newIdx = idx + delta;
            if (newIdx >= 0 && newIdx < keys.length) {
                selectStudy(keys[newIdx]);
            }
        }

        let isSliding = false;
        slider.oninput = function() {
            if (isSliding) return;
            isSliding = true;
            requestAnimationFrame(() => {
                updateViewer(parseInt(this.value));
                isSliding = false;
            });
        };

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlice(1);
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') changeSlice(-1);
            if (e.key === 'PageDown') changeStudy(1);
            if (e.key === 'PageUp') changeStudy(-1);
        });

        // Search functionality
        document.getElementById('study-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.study-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'block' : 'none';
            });
        });

        // Slice jump functionality
        sliceJumpInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(e.target.value);
                const total = studies[currentStudyId].slices.length;
                if (!isNaN(val) && val >= 1 && val <= total) {
                    updateViewer(val - 1);
                } else {
                    e.target.value = currentIndex + 1;
                }
                e.target.blur();
            }
        });

        let isScrolling = false;
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('.study-list')) return;
            if (isScrolling) return;
            
            isScrolling = true;
            requestAnimationFrame(() => {
                if (e.deltaY > 0) changeSlice(1);
                else changeSlice(-1);
                setTimeout(() => { isScrolling = false; }, 50); // Small cooldown
            });
        }, { passive: true });

        // Initialize with first study
        const firstStudy = Object.keys(studies)[0];
        if (firstStudy) selectStudy(firstStudy);
    </script>
</body>
</html>
